name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v5

      - id: setup
        uses: ./.github/actions/setup-build
        with:
          preset: ${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Saved right after configure, so a later red step does not lose the built dependencies.
      - name: Save vcpkg binary archives
        if: always() && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - id: setup
        uses: ./.github/actions/setup-build
        with:
          preset: release

      - name: Configure
        run: cmake --preset release

      - name: Save vcpkg binary archives
        if: always() && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Lint (clang-tidy)
        run: cmake --build --preset release --target lint

  # Needs no compiler or vcpkg: clang-format pinned to the version the project is formatted with.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clang-format 19.1.5
        run: python -m pip install clang-format==19.1.5

      - name: Format check
        run: cmake -DSOURCE_DIR="$GITHUB_WORKSPACE" -DCLANG_FORMAT="$(command -v clang-format)" -DMODE=check -P cmake/scripts/format.cmake
