# Alert rules (format: src/core/alerts/config.hpp). Producers report readings by metric and
# entity: volumes by mount point ("C:"); disk health facts by the stable drive key (model +
# serial hash), so baselines never mix two drives when disk numbers change; programs by the
# lower-case image name of their process trees' root.

# At most one toast per rule and entity within this many minutes.
rate_limit_minutes = 5

# The Windows drive by share (reported for the system volume only), every drive by what is left.
[[rule]]
id = "volume.free-space-low"
title = "Drive is almost full"
metric = "volume.free_percent"
severity = "warning"
below = 10
unit = "%"

[[rule]]
id = "volume.free-gib-low"
title = "Drive is almost full"
metric = "volume.free_gib"
severity = "warning"
below = 50
unit = "GiB"

[[rule]]
id = "volume.fill-up"
title = "Drive will be full soon"
metric = "volume.days_until_full"  # infinite when the volume is not filling
severity = "warning"
below = 14
unit = "days"

[[rule]]
id = "disk.media-errors"
title = "Drive reported new media errors"
metric = "disk.media_errors"
severity = "critical"
change = "increase"

[[rule]]
id = "disk.reallocated-sectors"
title = "Drive replaced damaged sectors"
metric = "disk.reallocated_sectors"
severity = "critical"
change = "increase"

[[rule]]
id = "disk.pending-sectors"
title = "Drive has sectors waiting to be replaced"
metric = "disk.pending_sectors"
severity = "critical"
change = "increase"

[[rule]]
id = "disk.temperature"
title = "Drive is hotter than its rated limit"
metric = "disk.temperature_over_limit"  # degrees above the model's limit; only when one is known
severity = "warning"
above = 0

[[rule]]
id = "disk.health-degraded"
title = "Drive health is degraded"
metric = "disk.health_status"  # 0 good, 1 warning, 2 failing
severity = "warning"
above = 0.5

[[rule]]
id = "disk.health-failing"
title = "Drive reports it is failing"
metric = "disk.health_status"
severity = "critical"
above = 1.5

# A plan's verification (optimizer spec, "Auto-Undo When Worse"; src/core/cleaning/executor.hpp):
# the entity is the plan id. An optimization that made the metric it targets worse is undone at
# once when it can be; any plan that made it worse and was kept, and an optimization whose effect
# could not be measured, are reported. The detail gives the metric before and after.
[[rule]]
id = "plan.rolled-back"
title = "MyClean undid a change that made things worse"
metric = "plan.rolled_back"
severity = "warning"
above = 0.5

[[rule]]
id = "plan.worse"
title = "A change made things worse"
metric = "plan.worse"
severity = "warning"
above = 0.5

[[rule]]
id = "plan.unverified"
title = "MyClean could not measure a change's effect"
metric = "plan.unverified"
severity = "info"
above = 0.5

# A guided pause of a freeze suspect is over (guided freeze elimination; src/core/elimination):
# the owner quit the program for the pause and is reminded to start it again. The entity is the
# plan id.
[[rule]]
id = "freeze.guided-pause-ended"
title = "Start the paused program again"
metric = "freeze.guided_pause_ended"
severity = "info"
above = 0.5

# A program whose process trees' private bytes (commit charge) rose hour after hour without
# falling back (core/resident/leak.hpp); the entity is the program's lower-case image name and
# the value the whole hours of steady growth, so this fires at 6 hours. MyClean only reports it:
# nothing suspends, caps or ends the program.
[[rule]]
id = "process.memory-leak"
title = "A program's memory keeps growing"
metric = "process.private_growth_hours"
severity = "warning"
above = 5
unit = "hours"
