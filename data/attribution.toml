# What the well-known locations of a volume are, for `myclean map` (format:
# src/core/map/attribution.hpp). Each area names its locations, what they are in plain English,
# and how their space can be reclaimed:
#   none            needed as it is
#   clean-rule      a cleaning rule of data/rules (ref = rule id)
#   handler         a Windows cleanup handler (ref = handler name)
#   relocate        moves to another drive: a relocation target of MyClean (ref = temp, gradle,
#                   cargo, npm, nuget, pip, go_modules, go_build or unreal_ddc), or the tool's
#                   own move (ref = wsl: `wsl --manage <distro> --move`; docker: Docker Desktop's
#                   disk image location)
#   setting         a system setting (ref = hibernation, page_file or shadow_storage)
#   uninstall       goes away when its program, game or toolchain is uninstalled
#   manual-review   only the owner can decide; the note says how
# A folder belongs to the area whose location names it most precisely (the most path
# components); between two equally precise locations the first in this file wins. Locations
# with a variable that is not set on this machine are skipped.

# ---- Windows ----------------------------------------------------------------------------------

[[area]]
id       = "windows.hibernation"
paths    = ['?:\hiberfil.sys']
category = "page-hibernate"
label    = "Hibernation file (memory saved for Fast Startup and hibernate)"
reclaim  = { kind = "setting", ref = "hibernation", note = "Reduced hibernation halves it and keeps Fast Startup; off removes it." }

[[area]]
id       = "windows.page_file"
paths    = ['?:\pagefile.sys', '?:\swapfile.sys']
category = "page-hibernate"
label    = "Page file (virtual memory)"
reclaim  = { kind = "setting", ref = "page_file", note = "Move most of it to another drive, keeping a small one here for crash dumps." }

[[area]]
id       = "windows.restore_points"
paths    = ['?:\System Volume Information']
category = "restore-points"
label    = "Restore points and shadow copies (needs admin to size)"
reclaim  = { kind = "setting", ref = "shadow_storage", note = "Cap the shadow storage; the oldest restore points that no longer fit are removed." }

[[area]]
id       = "windows.recycle_bin"
paths    = ['?:\$Recycle.Bin']
category = "recycle-bin"
label    = "Recycle Bin"
reclaim  = { kind = "clean-rule", ref = "windows.recycle_bin", note = "Empties the Recycle Bin; other users' bins need admin." }

[[area]]
id       = "windows.system"
paths    = ['%WINDIR%']
category = "system"
label    = "Windows"
reclaim  = { kind = "none" }

[[area]]
id       = "windows.component_store"
paths    = ['%WINDIR%\WinSxS']
category = "windows-servicing"
label    = "Component store (WinSxS); most files are hard links shared with Windows, counted once"
reclaim  = { kind = "clean-rule", ref = "windows.component_store", note = "DISM StartComponentCleanup removes superseded components only; DISM reports the exact amount." }

[[area]]
id       = "windows.installer_cache"
paths    = ['%WINDIR%\Installer']
category = "windows-servicing"
label    = "Windows Installer cache (needed to repair and uninstall programs)"
reclaim  = { kind = "manual-review", note = "Never delete. Orphaned packages can later be moved to another drive." }

[[area]]
id       = "windows.update_downloads"
paths    = ['%WINDIR%\SoftwareDistribution']
category = "windows-servicing"
label    = "Windows Update downloads and history"
reclaim  = { kind = "manual-review", note = "Windows removes downloads after updates install; a large folder usually means a stuck update." }

[[area]]
id       = "windows.driver_store"
paths    = ['%WINDIR%\System32\DriverStore']
category = "windows-servicing"
label    = "Driver store (installed and older drivers)"
reclaim  = { kind = "clean-rule", ref = "windows.driver_packages", note = "Removes older versions of drivers only." }

[[area]]
id       = "windows.temp"
paths    = ['%WINDIR%\Temp']
category = "app-caches"
label    = "Windows temporary files"
reclaim  = { kind = "clean-rule", ref = "windows.temp.system" }

[[area]]
id       = "windows.live_kernel_reports"
paths    = ['%WINDIR%\LiveKernelReports']
category = "system"
label    = "Kernel crash reports"
reclaim  = { kind = "clean-rule", ref = "windows.live_kernel_reports" }

[[area]]
id       = "windows.memory_dump"
paths    = ['%WINDIR%\MEMORY.DMP']
category = "system"
label    = "System crash memory dump"
reclaim  = { kind = "clean-rule", ref = "windows.memory_dumps" }

[[area]]
id       = "windows.minidumps"
paths    = ['%WINDIR%\Minidump']
category = "system"
label    = "System crash minidumps"
reclaim  = { kind = "clean-rule", ref = "windows.minidumps" }

[[area]]
id       = "windows.wer.system"
paths    = ['%ProgramData%\Microsoft\Windows\WER']
category = "system"
label    = "Windows error reports (all users)"
reclaim  = { kind = "clean-rule", ref = "windows.wer.system" }

[[area]]
id       = "windows.old"
paths    = ['?:\Windows.old']
category = "windows-servicing"
label    = "Previous Windows installation (allows rolling back an upgrade)"
reclaim  = { kind = "clean-rule", ref = "windows.previous_installations", note = "Removing it ends the option to go back to the previous Windows version." }

[[area]]
id       = "windows.setup_files"
paths    = ['?:\$WINDOWS.~BT', '?:\$WINDOWS.~WS', '?:\$GetCurrent']
category = "windows-servicing"
label    = "Windows upgrade setup files"
reclaim  = { kind = "clean-rule", ref = "windows.temporary_setup_files" }

[[area]]
id       = "windows.esd"
paths    = ['?:\ESD']
category = "windows-servicing"
label    = "Windows installation images (ESD) used to reset the PC"
reclaim  = { kind = "clean-rule", ref = "windows.esd_files", note = "Reset this PC can download them again." }

[[area]]
id       = "windows.recovery"
paths    = ['?:\Recovery', '?:\$SysReset']
category = "system"
label    = "Windows recovery environment"
reclaim  = { kind = "none" }

[[area]]
id       = "windows.setup_logs"
paths    = ['%WINDIR%\Panther']
category = "windows-servicing"
label    = "Windows setup and upgrade logs"
reclaim  = { kind = "clean-rule", ref = "windows.setup_logs" }

[[area]]
id       = "windows.assembly"
paths    = ['%WINDIR%\assembly']
category = "system"
label    = ".NET Framework global assembly cache"
reclaim  = { kind = "none" }

[[area]]
id       = "windows.hyperv_disks"
paths    = ['%ProgramData%\Microsoft\Windows\Virtual Hard Disks', '%PUBLIC%\Documents\Hyper-V']
category = "vm-disks"
label    = "Hyper-V virtual machine disks"
reclaim  = { kind = "manual-review", note = "Delete unused virtual machines in Hyper-V Manager, or move them to another drive." }

