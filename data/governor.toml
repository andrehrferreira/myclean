# Resource governor policy (format: src/core/governor/policy.hpp; behaviour:
# .rulebook/tasks/phase3_resource-governor/specs/governor/spec.md). Every value below is the
# default; a key left out keeps it. A file that fails validation is rejected whole and the
# governor keeps the policy it had. The service reads this file at start and every 5 minutes.

# What the governor does with its decisions.
#   observe  every decision (ladder steps, rollbacks, proactive build/test jobs, owner choices) is
#            recorded in governor_event with detail "observe"; no process, priority or job object
#            is changed and no job is created. The pilot's default: watch what it would do first.
#   act      every decision is applied, and each change also goes to action_log.
# Crash recovery and the clean stop lift MyClean's own caps and resume its own suspends in
# either mode.
[governor]
mode = "observe"

# Entering the pressure state: any one signal is enough.
[pressure]
cpu_percent = 90               # total CPU above this ...
cpu_seconds = 15               # ... for this many seconds in a row
available_gib = 8              # available memory below this many GiB
commit_percent = 90            # commit charge above this share of the commit limit
hard_faults_per_second = 1000  # hard page faults per second above this ...
hard_faults_seconds = 15       # ... for this many seconds in a row

# Leaving it: every signal at its exit threshold for `seconds` without a break; a signal past
# its exit threshold restarts the count.
[clear]
cpu_percent = 80               # at most
available_gib = 10             # at least
commit_percent = 85            # at most
# hard_faults_per_second = 500 # at most; default: half of [pressure] hard_faults_per_second
seconds = 60

# The escalation ladder on the heaviest unprotected process tree: (1) below-normal priority and
# low memory priority, (2) EcoQoS, (3) a cap job, (4) suspend with an owner notification,
# (5) kill, only for the classes listed in `kill`.
[ladder]
cooldown_seconds = 10                # at least this long between two steps on one tree
cap_cpu_percent = 50                 # step 3: CPU hard cap of the cap job
cap_commit_headroom_percent = 25     # step 3: commit cap = the tree's commit plus this share,
cap_commit_min_headroom_mib = 64     #   but at least this many MiB above it
resume_blocks_suspend_minutes = 10   # after the owner's Resume, no new suspend of that tree
kill = []                            # e.g. ["default"]; allowed: build, test, default

# While a game runs (or the tray's override is "on").
[game_mode]
pressure_seconds = 5                 # replaces cpu_seconds and hard_faults_seconds
cooldown_seconds = 5                 # replaces ladder.cooldown_seconds
build_cpu_percent = 40               # CPU cap of every build job

# Proactive jobs of build and test trees.
[jobs]
notification_percent = 80            # commit notification limit, share of the commit cap
rearm_percent = 70                   # set again once the job's commit is below this share

[jobs.build]
cpu_percent = 75                     # CPU hard cap of each build tree job
commit_gib = 96                      # commit cap of the whole tree

[jobs.test]
cpu_percent = 75
commit_gib = 64

[notifications]
interval_minutes = 5                 # at most one owner notification per tree this often
