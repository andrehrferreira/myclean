id          = "adobe"
version     = "1.2.0"
title       = "Adobe apps"
description = "Adobe app data, caches and the Premiere Pro and After Effects media cache (for review), the shared Camera Raw profiles and models (uninstall), and what the Creative Cloud and Acrobat processes are."
sources     = [
  "observed on reference machine: %LOCALAPPDATA%\\Adobe and %APPDATA%\\Adobe (including Substance 3D); the media cache in %APPDATA%\\Adobe\\Common\\Media Cache Files and Media Cache",
  "observed on reference machine: the Creative Cloud and Acrobat processes, their image paths and signers",
  "observed on reference machine: %ProgramData%/Adobe/CameraRaw holds ModelZoo, CameraProfiles and LensProfiles, 2.3 GiB",
  "observed on reference machine (2026-11-10 scan-all of C:): %APPDATA%\\com.adobe.dunamis holds GUID-named folders, 0.36 GiB",
]
min_myclean = "0.1.0"

[applies_when]
any = [{ path_exists = '%LOCALAPPDATA%\Adobe' }, { path_exists = '%APPDATA%\Adobe' },
       { path_exists = '%ProgramFiles%\Adobe' }, { path_exists = '%ProgramFiles(x86)%\Adobe' },
       { path_exists = '%ProgramData%\Adobe' }]
