# Browser caches, every profile: HTTP cache, code cache and GPU caches only (cleaning spec,
# "Browser rule limits"; sources: pack.toml). Cookies, history, passwords, sessions and every
# other profile file are never targets. A running browser keeps its cache files open, so
# not_in_use skips it. Chrome's WebGPU (Dawn) caches are in the chrome pack.

[[rule]]
id       = "chrome-cache"
category = "browsers"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache',
            '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache',
            '%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache',
            '%LOCALAPPDATA%\Google\Chrome\User Data\ShaderCache',
            '%LOCALAPPDATA%\Google\Chrome\User Data\GrShaderCache',
            '%LOCALAPPDATA%\Google\Chrome\User Data\GraphiteDawnCache']
require  = { not_in_use = true }

[[rule]]
id       = "edge-cache"
category = "browsers"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache',
            '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache',
            '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\GPUCache',
            '%LOCALAPPDATA%\Microsoft\Edge\User Data\ShaderCache',
            '%LOCALAPPDATA%\Microsoft\Edge\User Data\GrShaderCache',
            '%LOCALAPPDATA%\Microsoft\Edge\User Data\GraphiteDawnCache']
require  = { not_in_use = true }

[[rule]]
id       = "brave-cache"
category = "browsers"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Cache',
            '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Code Cache',
            '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\GPUCache',
            '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\ShaderCache',
            '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\GrShaderCache',
            '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\GraphiteDawnCache']
