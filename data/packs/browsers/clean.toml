# Firefox keeps its caches in the local profile; cookies and history live in the roaming one.
[[rule]]
id       = "firefox-cache"
category = "browsers"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2',
            '%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\startupCache']
require  = { not_in_use = true }
