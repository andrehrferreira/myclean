id          = "cpp"
version     = "1.1.0"
title       = "C and C++ builds (MSBuild, CMake)"
description = "Build output of inactive Visual C++ (vcxproj) and CMake projects, and idle CMake build trees of active ones, cleaned when git ignores it."
sources     = [
  "observed on reference machine: Visual C++ projects (*.vcxproj) with bin, obj, x64, Debug and Release, and CMake projects (CMakeLists.txt) with build*, out and cmake-build-* folders, ignored by git (analysis F-012)",
  "https://cmake.org/cmake/help/latest/manual/cmake.1.html (--fresh: removes CMakeCache.txt and CMakeFiles and recreates them; a build tree is regenerated by configuring again)",
  "https://cmake.org/Bug/view.php?id=14820 (a maintainer: wipe an out-of-source build tree completely and re-create it from scratch)",
  "observed on reference machine: F:\\MyClean\\build holds 60+ CMake build trees (build\\<preset>, 77 GiB), most idle while the project is active (analysis F 04, E 09)",
]
min_myclean = "0.1.0"

[applies_when]
any = [{ path_exists = '%ProgramFiles%\Microsoft Visual Studio' }, { path_exists = '%ProgramFiles(x86)%\Microsoft Visual Studio' },
       { path_exists = '%ProgramFiles%\CMake' }, { path_exists = '%ProgramFiles%\LLVM' }]
