# Process images the knowledge base of this pack recognizes (kb.json), and one it does
# not.

[[expect]]
kind     = "kb"
case     = "autodesk.licensing-service"
match    = ['AdskLicensingService.exe']
no_match = ['notepad++.exe']

[[expect]]
kind     = "kb"
case     = "autodesk.access-service-host"
match    = ['AdskAccessServiceHost.exe']

[[expect]]
kind     = "kb"
case     = "autodesk.cer-service"
match    = ['cer_service.exe']
