# The developer folders of the reference machine.

[[expect]]
kind     = "attribution"
case     = "user-cache"
match    = ['C:\Users\owner\.cache']
no_match = ['C:\Users\owner\.config']

[[expect]]
kind     = "attribution"
case     = "projects"
match    = ['C:\Users\owner\source\repos', 'C:\Users\owner\Documents\GitHub', 'C:\Users\owner\Documents\Unreal Projects',
            'C:\Users\owner\Documents\Visual Studio 2022\Projects']
no_match = ['C:\Users\owner\Documents', 'C:\Users\owner\source']

[[expect]]
kind     = "attribution"
case     = "sdks"
match    = ['C:\Program Files (x86)\Windows Kits', 'C:\Program Files\dotnet', 'C:\Program Files\NVIDIA GPU Computing Toolkit',
            'C:\Program Files\LLVM', 'C:\Program Files\Go', 'C:\Program Files\Android']
no_match = ['C:\Program Files\Git']
