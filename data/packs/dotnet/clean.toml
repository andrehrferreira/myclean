targets  = ["bin", "obj", "x64", "Debug", "Release"]
require  = { git_ignored = true, not_in_use = true, inactive_days = 30 }

# NuGet's folders (cleaning spec, "Native Prune Commands Under the User Token"; analysis F-013),
# cleared with the .NET CLI, run by the tray under the owner's token. The targets are only
# measured: the rule is offered when they hold anything, sized by what they hold now.
[[rule]]
id       = "nuget-locals"
category = "package-managers"
tier     = "ask"
scope    = "user"
strategy = "native"
command  = "dotnet nuget locals all --clear"
targets  = ['%USERPROFILE%\.nuget\packages', '%LOCALAPPDATA%\NuGet\v3-cache']
