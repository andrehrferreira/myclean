# Sources: pack.toml.

[[area]]
id       = "discord-cache"
paths    = ['%APPDATA%\discord\Cache', '%APPDATA%\discord\Code Cache', '%APPDATA%\discord\GPUCache',
            '%APPDATA%\discord\Crashpad']
category = "app-caches"
label    = "Discord cache"
reclaim  = { kind = "clean-rule", ref = "discord" }

[[area]]
id       = "slack-cache"
paths    = ['%APPDATA%\Slack\Cache', '%APPDATA%\Slack\Code Cache', '%APPDATA%\Slack\GPUCache', '%APPDATA%\Slack\Crashpad']
category = "app-caches"
label    = "Slack cache"
reclaim  = { kind = "clean-rule", ref = "slack" }

[[area]]
id       = "teams-classic-cache"
paths    = ['%APPDATA%\Microsoft\Teams\Cache', '%APPDATA%\Microsoft\Teams\Code Cache', '%APPDATA%\Microsoft\Teams\GPUCache',
            '%APPDATA%\Microsoft\Teams\Crashpad']
category = "app-caches"
label    = "Teams (classic) cache"
reclaim  = { kind = "clean-rule", ref = "teams-classic" }

[[area]]
id       = "teams-cache"
paths    = ['%LOCALAPPDATA%\Packages\MSTeams_8wekyb3d8bbwe\LocalCache\Microsoft\MSTeams\EBWebView\*\Cache',
            '%LOCALAPPDATA%\Packages\MSTeams_8wekyb3d8bbwe\LocalCache\Microsoft\MSTeams\EBWebView\*\Code Cache',
            '%LOCALAPPDATA%\Packages\MSTeams_8wekyb3d8bbwe\LocalCache\Microsoft\MSTeams\EBWebView\*\GPUCache']
category = "app-caches"
label    = "Teams cache"
reclaim  = { kind = "clean-rule", ref = "teams" }

[[area]]
id       = "updater-downloads"
paths    = ['%LOCALAPPDATA%\*-updater']
category = "app-caches"
label    = "Downloaded app updates (Electron apps' auto-updater)"
reclaim  = { kind = "clean-rule", ref = "updater-downloads", note = "The app downloads its next update in full instead of as a difference." }

# The rest of each app's profile: sign-in, Local Storage, IndexedDB and the Service Worker
# CacheStorage the app keeps for itself (observed on reference machine).
[[area]]
id       = "electron-app-data"
paths    = ['%APPDATA%\discord', '%APPDATA%\Slack', '%APPDATA%\WhatsApp', '%APPDATA%\Replica Studios']
category = "apps"
label    = "Chromium-based app profiles (sign-in, local storage, service worker caches)"
reclaim  = { kind = "manual-review", note = "Each app manages its own profile; signing out or reinstalling the app resets it. Cache, Code Cache and GPUCache are cleaned by their own rules." }
