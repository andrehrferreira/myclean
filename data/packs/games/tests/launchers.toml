# Steam in its default folder (Program Files, kept by the deny-list) and the Epic Games
# launcher's web caches; the launchers' game folders.

[[entry]]
path = 'C:\Program Files (x86)\Steam\appcache\httpcache\3a\3a1f2b4c5d6e7f80'
[[entry]]
path = 'C:\Program Files (x86)\Steam\depotcache\228988_5390135823457912345.manifest'
[[entry]]
path = 'C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\pak01_dir.vpk'
[[entry]]
path = 'C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\webcache_4430\Cache\data_0'
[[entry]]
path = 'C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\webcache\Cache\data_0'
[[entry]]
path = 'C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\Config\Windows\GameUserSettings.ini'
[[entry]]
path = 'C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\Logs\EpicGamesLauncher.log'

# Under Program Files the deny-list drops every item (see clean.toml).
[[expect]]
kind     = "clean"
case     = "steam-httpcache"
no_match = ['C:\Program Files (x86)\Steam\appcache\httpcache\3a']

[[expect]]
kind     = "clean"
case     = "steam-depotcache"
no_match = ['C:\Program Files (x86)\Steam\depotcache\228988_5390135823457912345.manifest',
            'C:\Program Files (x86)\Steam\steamapps']

[[expect]]
kind     = "clean"
case     = "epic-webcache"
match    = ['C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\webcache_4430',
            'C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\webcache']
no_match = ['C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\Config',
            'C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\Logs']

[[expect]]
kind     = "attribution"
case     = "steam-client"
match    = ['C:\Program Files (x86)\Steam']

[[expect]]
kind     = "attribution"
case     = "steam-library"
match    = ['C:\Program Files (x86)\Steam\steamapps', 'D:\SteamLibrary', 'E:\Program Files\Steam\steamapps']
no_match = ['C:\Program Files (x86)\Steam\appcache']

[[expect]]
kind     = "attribution"
case     = "steam-httpcache"
match    = ['C:\Program Files (x86)\Steam\appcache\httpcache']

[[expect]]
kind     = "attribution"
case     = "steam-depotcache"
match    = ['C:\Program Files (x86)\Steam\depotcache']

[[expect]]
kind     = "attribution"
case     = "epic"
match    = ['C:\Program Files\Epic Games', 'D:\Epic Games']

[[expect]]
kind     = "attribution"
case     = "epic-webcache"
match    = ['C:\Users\owner\AppData\Local\EpicGamesLauncher\Saved\webcache_4430']

[[expect]]
kind     = "attribution"
case     = "other-launchers"
match    = ['D:\XboxGames', 'C:\Riot Games', 'C:\Program Files (x86)\Battle.net', 'D:\GOG Games']

[[expect]]
kind     = "attribution"
case     = "epic-launcher-data"
match    = ['C:\ProgramData\Epic\EpicGamesLauncher']

# Unreal games' per-user data (reference machine): logs, crash reports and the shader byte-code
# cache go; settings, saves and a log being written stay.
[[entry]]
path = 'C:\Users\owner\AppData\Local\ABInfinite\Saved\Logs\ABInfinite-backup-2026.08.01.log'
[[entry]]
path = 'C:\Users\owner\AppData\Local\ABInfinite\Saved\Logs\ABInfinite.log'
age_days = 0
[[entry]]
path = 'C:\Users\owner\AppData\Local\SCUM\Saved\Crashes\UECC-Windows-1A2B3C\UEMinidump.dmp'
[[entry]]
path = 'C:\Users\owner\AppData\Local\b1\Saved\D3DDriverByteCodeBlob_V4318_D8712_S-2012671933_R161.ushaderprecache'
[[entry]]
path = 'C:\Users\owner\AppData\Local\b1\Saved\Config\Windows\GameUserSettings.ini'
[[entry]]
path = 'C:\Users\owner\AppData\Local\b1\Saved\SaveGames\slot0.sav'

[[expect]]
kind     = "clean"
case     = "unreal-game-logs"
match    = ['C:\Users\owner\AppData\Local\ABInfinite\Saved\Logs\ABInfinite-backup-2026.08.01.log',
            'C:\Users\owner\AppData\Local\SCUM\Saved\Crashes\UECC-Windows-1A2B3C']
no_match = ['C:\Users\owner\AppData\Local\ABInfinite\Saved\Logs\ABInfinite.log',
            'C:\Users\owner\AppData\Local\b1\Saved\Config\Windows\GameUserSettings.ini',
            'C:\Users\owner\AppData\Local\b1\Saved\SaveGames\slot0.sav']

[[expect]]
kind     = "clean"
case     = "unreal-game-shader-precache"
match    = ['C:\Users\owner\AppData\Local\b1\Saved\D3DDriverByteCodeBlob_V4318_D8712_S-2012671933_R161.ushaderprecache']
no_match = ['C:\Users\owner\AppData\Local\b1\Saved\SaveGames\slot0.sav', 'C:\Users\owner\AppData\Local\b1\Saved']

[[expect]]
kind     = "attribution"
case     = "unreal-game-logs"
match    = ['C:\Users\owner\AppData\Local\SCUM\Saved\Crashes']
