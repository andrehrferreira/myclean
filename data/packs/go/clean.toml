# Go's caches (cleaning spec, "Native Prune Commands Under the User Token"; analysis F-013;
# sources: pack.toml), cleaned with Go's own command, run by the tray under the owner's token.
# The targets are only measured: the rule is offered when they hold anything, sized by what
# they hold now.

[[rule]]
id       = "cache"
category = "package-managers"
tier     = "auto"
scope    = "user"
strategy = "native"
command  = "go clean -cache -modcache"
targets  = ['%LOCALAPPDATA%\go-build', '%USERPROFILE%\go\pkg\mod']
