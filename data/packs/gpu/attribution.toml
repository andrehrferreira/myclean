# Sources: pack.toml.

[[area]]
id       = "nvidia-dxcache"
paths    = ['%LOCALAPPDATA%\NVIDIA\DXCache', '%USERPROFILE%\AppData\LocalLow\NVIDIA\PerDriverVersion\DXCache']
category = "app-caches"
label    = "NVIDIA DirectX shader cache"
reclaim  = { kind = "clean-rule", ref = "nvidia-dxcache", note = "Games rebuild it, with some stutter at first." }

[[area]]
id       = "nvidia-glcache"
paths    = ['%LOCALAPPDATA%\NVIDIA\GLCache', '%USERPROFILE%\AppData\LocalLow\NVIDIA\PerDriverVersion\GLCache']
category = "app-caches"
label    = "NVIDIA OpenGL and Vulkan shader cache"
reclaim  = { kind = "clean-rule", ref = "nvidia-glcache", note = "Games rebuild it, with some stutter at first." }

[[area]]
id       = "d3dscache"
paths    = ['%LOCALAPPDATA%\D3DSCache']
category = "app-caches"
label    = "DirectX shader cache"
reclaim  = { kind = "clean-rule", ref = "d3dscache" }

[[area]]
id       = "amd-cache"
paths    = ['%LOCALAPPDATA%\AMD\DxCache', '%LOCALAPPDATA%\AMD\DxcCache', '%LOCALAPPDATA%\AMD\VkCache']
category = "app-caches"
label    = "AMD shader cache"
reclaim  = { kind = "clean-rule", ref = "amd-cache", note = "Games rebuild it, with some stutter at first." }

[[area]]
id       = "driver-installers"
paths    = ['?:\NVIDIA', '?:\AMD', '%ProgramData%\NVIDIA Corporation\Downloader', '%ProgramFiles%\NVIDIA Corporation\Installer2',
            '%ProgramData%\NVIDIA Corporation\NVIDIA App\UpdateFramework']
category = "app-caches"
label    = "Graphics driver installer files"
reclaim  = { kind = "manual-review", note = "Left behind by driver installs; not needed once the driver is installed." }

[[area]]
id       = "nvidia-app-downloads"
paths    = ['%ProgramData%\NVIDIA Corporation\NVIDIA App\UpdateFramework\ota-artifacts']
category = "app-caches"
label    = "Drivers and updates the NVIDIA app downloaded"
reclaim  = { kind = "clean-rule", ref = "nvidia-app-downloads", note = "Downloads older than two weeks are deleted by themselves; the app downloads a driver again to reinstall it." }

# AI models NVIDIA Broadcast (nvbcast*) and the driver's DLSS updates (dlss*) download
# (observed on reference machine: C:\ProgramData\NVIDIA\NGX\models, 4.6 GiB).
[[area]]
id       = "ngx-models"
paths    = ['%ProgramData%\NVIDIA\NGX\models']
category = "apps"
label    = "NVIDIA AI models (NVIDIA Broadcast effects, DLSS updates)"
reclaim  = { kind = "uninstall", note = "Uninstalling NVIDIA Broadcast removes its models; the DLSS files belong to the driver." }

[[area]]
id       = "nvidia-broadcast-data"
paths    = ['%ProgramData%\NVIDIA Corporation\NVIDIA Broadcast']
category = "apps"
label    = "NVIDIA Broadcast assets and data"
reclaim  = { kind = "uninstall", note = "Goes with NVIDIA Broadcast." }
