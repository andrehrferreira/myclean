id          = "python-store"
version     = "1.1.0"
title       = "Python from the Microsoft Store"
description = "Store installs of Python: the install with its user packages (for review) and pip's download cache, which the Store package keeps inside its own folder (cleaned)."
sources     = [
  "https://docs.python.org/3/using/windows.html#the-microsoft-store-package (writes to %LOCALAPPDATA% are redirected into the package's private folder)",
  "https://pip.pypa.io/en/stable/topics/caching/ (pip's cache: HTTP responses and built wheels, safe to remove; `pip cache purge`)",
  "observed on reference machine: %LOCALAPPDATA%\\Packages\\PythonSoftwareFoundation.Python.3.12_qbz5n2kfra8p0\\LocalCache with Local\\pip and local-packages",
]
min_myclean = "0.1.0"

[applies_when]
any = [{ app_installed = '^PythonSoftwareFoundation\.Python\.' },
       { path_exists = '%LOCALAPPDATA%\Packages\PythonSoftwareFoundation.Python.*' }]
