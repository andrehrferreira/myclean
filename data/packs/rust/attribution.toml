# Sources: pack.toml.

[[area]]
id       = "toolchains"
paths    = ['%USERPROFILE%\.rustup', '%RUSTUP_HOME%']
category = "dev-toolchains"
label    = "Rust toolchains (rustup)"
reclaim  = { kind = "relocate", ref = "rustup-home", note = "Also compresses well with LZX. `rustup toolchain uninstall <name>` removes one you no longer use." }

[[area]]
id       = "cargo-registry"
paths    = ['%USERPROFILE%\.cargo\registry', '%CARGO_HOME%\registry', '%USERPROFILE%\.cargo\git', '%CARGO_HOME%\git']
category = "dev-caches"
label    = "Cargo downloaded crates and git dependencies"
reclaim  = { kind = "clean-rule", ref = "registry-cache", note = "Crates unused for 90 days are offered; Cargo downloads them again when a build needs them." }

[[area]]
id       = "cargo-home"
paths    = ['%USERPROFILE%\.cargo']
category = "dev-caches"
label    = "Cargo registry, git checkouts and installed tools"
reclaim  = { kind = "relocate", ref = "cargo" }

# ONNX Runtime libraries the `ort` crate's build script downloads, one folder per target and
# build hash (observed on reference machine: four builds, 1.2 GiB).
[[area]]
id       = "ort-binaries"
paths    = ['%LOCALAPPDATA%\ort.pyke.io']
category = "dev-caches"
label    = "ONNX Runtime libraries downloaded by Rust builds (ort crate)"
reclaim  = { kind = "manual-review", note = "Downloaded again by a build that needs them; keep the newest folder if you build offline." }
