id          = "rust"
version     = "1.0.0"
title       = "Rust (rustup and Cargo)"
description = "rustup toolchains (compressible, movable with RUSTUP_HOME) and Cargo's downloaded crates and git checkouts, which Cargo restores when needed."
sources     = [
  "https://rust-lang.github.io/rustup/installation/index.html#choosing-where-to-install (RUSTUP_HOME, default %USERPROFILE%\\.rustup; CARGO_HOME, default %USERPROFILE%\\.cargo)",
  "https://doc.rust-lang.org/cargo/guide/cargo-home.html (registry/cache holds .crate files, registry/src their unpacked sources, git/checkouts working copies of git dependencies; Cargo restores any part of the cache that is removed)",
  "observed on reference machine: %USERPROFILE%\\.rustup\\toolchains; %USERPROFILE%\\.cargo\\registry\\cache\\index.crates.io-1949cf8c6b5b557f; LZX saves 1.12 times what XPRESS 32K saves on a Rust toolchain (compress analyzer measurement)",
]
min_myclean = "0.1.0"

[applies_when]
any = [{ path_exists = '%USERPROFILE%\.rustup' }, { path_exists = '%RUSTUP_HOME%' },
       { path_exists = '%USERPROFILE%\.cargo' }, { path_exists = '%CARGO_HOME%' }]
