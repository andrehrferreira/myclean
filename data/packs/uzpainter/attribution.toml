# Sources: pack.toml.

[[area]]
id       = "app-data"
paths    = ['%LOCALAPPDATA%\UzPainter']
category = "apps"
label    = "UzPainter app data (work, verification and parity stores)"
reclaim  = { kind = "manual-review", note = "Only the app's owner knows which stores are still needed." }

[[area]]
id       = "cache"
paths    = ['%LOCALAPPDATA%\UzPainter\cache']
category = "app-caches"
label    = "UzPainter cache"
reclaim  = { kind = "clean-rule", ref = "cache", note = "Entries untouched for two weeks are offered." }

[[area]]
id       = "verification-pytest-temp"
paths    = ['%LOCALAPPDATA%\UzPainter\verification\*\pytest-temp']
category = "build-artifacts"
label    = "UzPainter verification runs' test files (pytest temporary folder)"
reclaim  = { kind = "clean-rule", ref = "verification-pytest-temp", note = "pytest empties it at the start of the next run anyway." }
