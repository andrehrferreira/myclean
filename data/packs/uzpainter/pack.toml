id          = "uzpainter"
version     = "1.1.0"
title       = "UzPainter"
description = "UzPainter's app data (work, verification and parity stores, for review), the test files its verification runs leave (cleaned) and its cache (cleaned, asking first)."
sources     = [
  "observed on reference machine: %LOCALAPPDATA%\\UzPainter holds the app's work, verification and parity stores and a cache folder",
  "observed on reference machine: %LOCALAPPDATA%\\UzPainter\\verification\\<run>\\pytest-temp (9.5 GiB) beside the run's pytest.log and report.json; %LOCALAPPDATA%\\UzPainter\\cache\\eval and lighting, one folder per content hash (1.3 GiB)",
  "https://docs.pytest.org/en/stable/how-to/tmp_path.html (a --basetemp folder is cleared blindly before each test run)",
]
min_myclean = "0.1.0"

[applies_when]
any = [{ path_exists = '%LOCALAPPDATA%\UzPainter' }]
