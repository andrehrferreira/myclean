# Visual Studio's caches (analysis F-012, F-013, F-016; sources: pack.toml). Settings and
# installed extensions are never targets. The bin and obj trees of solutions are cases of the
# dotnet and cpp packs.

# The MEF component cache, rebuilt when Visual Studio starts.
[[rule]]
id       = "component-model-cache"
category = "ides"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Microsoft\VisualStudio\*\ComponentModelCache']
require  = { not_in_use = true }

# Visual Studio's per-user solution state (open documents, breakpoints): regenerable, but the
# owner may miss it. Artifact rules (cleaning spec, "Developer Artifact Qualification"): the
# project must be in a git work tree that ignores the folder, unused and inactive.
[[rule]]
id       = "sln-state"
category = "dev-artifacts"
tier     = "ask"
scope    = "user"
strategy = "delete"
project  = { marker = "*.sln" }
targets  = [".vs"]
require  = { git_ignored = true, not_in_use = true, inactive_days = 14 }

[[rule]]
id       = "slnx-state"
category = "dev-artifacts"
tier     = "ask"
scope    = "user"
strategy = "delete"
project  = { marker = "*.slnx" }
targets  = [".vs"]
require  = { git_ignored = true, not_in_use = true, inactive_days = 14 }

# The Visual Studio Installer's package cache (source: "Disable or move the package cache", see
# pack.toml): the installed packages' payloads, kept to repair or modify offline; "The installer
# will download them when needed". Every payload is one folder named <package>,version=<v>[,...]
# beside the installer's own state (_Instances, _Channels, _bootstrapper), which is never a
# target (observed on reference machine: 1,494 payload folders, 10.1 GiB). A running setup
# keeps its payloads open or recent.
[[rule]]
id       = "package-payloads"
category = "ides"
tier     = "auto"
scope    = "system"
strategy = "delete"
targets  = ['%ProgramData%\Microsoft\VisualStudio\Packages\*,version=*']
require  = { min_age_days = 30, not_in_use = true }
