id          = "visual-studio"
version     = "1.2.0"
title       = "Visual Studio"
description = "Visual Studio's component cache, the installer's downloaded package payloads, the IntelliSense, browse-database, Copilot and search caches inside .vs (cleaned on its own) and the per-user solution state (.vs) of inactive projects (cleaned); installations and per-user data are listed for review or uninstall."
sources     = [
  "https://learn.microsoft.com/visualstudio/install/disable-or-move-the-package-cache (the installer's package cache in %ProgramData%\\Microsoft\\VisualStudio\\Packages; 'Keep download cache after the installation'; the packages are needed only to repair offline: 'The installer will download them when needed')",
  "observed on reference machine: %ProgramData%\\Microsoft\\VisualStudio\\Packages holds 1,494 payload folders named <package>,version=<version>[,chip=...] (10.1 GiB, some from 2021) beside the installer's _Instances, _Channels and _bootstrapper",
  "observed on reference machine: %LOCALAPPDATA%\\Microsoft\\VisualStudio\\<version>_<instance>\\ComponentModelCache; .vs folders beside .sln and .slnx files, ignored by git (analysis F-012, F-013, F-016)",
  "observed on reference machine: vctip.exe, its image path and signer",
  "https://learn.microsoft.com/visualstudio/ide/reference/options-text-editor-c-cpp-advanced (the C++ browse database and the IntelliSense precompiled-header cache (ipch) are caches with a fallback location and a size quota, kept in the solution's .vs folder by default)",
  "observed on reference machine: G:\\ 15 .vs folders, 45.06 GiB: v17\\ipch (AutoPCH and *.ipch) 17.76, Browse.VC.db and Solution.VC.db 12.65, CopilotIndices\\17.14.794.21998 (CodeChunks.db, SemanticSymbols.db) 12.55, FileContentIndex\\*.vsidx 1.78, per-user state (.suo, DocumentLayout.json, fileList.bin) 0.32",
]
min_myclean = "0.1.0"

[applies_when]
any = [{ path_exists = '%ProgramFiles%\Microsoft Visual Studio' }, { path_exists = '%ProgramFiles(x86)%\Microsoft Visual Studio' },
       { path_exists = '%LOCALAPPDATA%\Microsoft\VisualStudio' }, { path_exists = '%ProgramData%\Microsoft\VisualStudio\Packages' }]
