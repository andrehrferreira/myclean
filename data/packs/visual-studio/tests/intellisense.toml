# The code-intelligence caches of solutions on G: (the reference machine's names). In two git
# work trees that ignore .vs and were last changed 10 days ago, the caches go and the per-user
# state stays (the whole .vs waits 14 days for sln-state). The live client is outside git: its
# caches go too, since only Visual Studio writes them. A work tree that does not ignore .vs keeps
# its cache, and a cache written yesterday stays.

[workspace]
roots = ['G:\']

