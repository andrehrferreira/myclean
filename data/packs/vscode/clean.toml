# VS Code's caches (sources: pack.toml). Settings, keybindings, snippets, extensions and History
# are never targets.

# One folder per VS Code version; older ones stay behind after updates.
[[rule]]
id       = "cached-data"
category = "ides"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%APPDATA%\Code\CachedData\*']
require  = { min_age_days = 30, not_in_use = true }

# The downloaded package of each installed extension; an update downloads it again.
[[rule]]
id       = "vsix-cache"
category = "ides"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%APPDATA%\Code\CachedExtensionVSIXs\*']
require  = { min_age_days = 30, not_in_use = true }

# Per-workspace state (open editors, extension state) of workspaces not opened for 90 days.
[[rule]]
id       = "workspace-storage"
category = "ides"
tier     = "ask"
scope    = "user"
strategy = "delete"
targets  = ['%APPDATA%\Code\User\workspaceStorage\*']
require  = { min_age_days = 90, not_in_use = true }

# Chromium's HTTP, code and GPU caches and crash reports of the VS Code (Electron) window. Local
# Storage, IndexedDB and cookies are never targets. A running VS Code keeps its cache files
# open, so not_in_use skips it.
[[rule]]
id       = "electron-cache"
category = "electron"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%APPDATA%\Code\Cache', '%APPDATA%\Code\Code Cache', '%APPDATA%\Code\GPUCache',
            '%APPDATA%\Code\Crashpad']
require  = { not_in_use = true }

# The Cache API storage of webviews: VS Code's webview service worker keeps copies of the local
# files a webview loads in caches named vscode-resource-cache-<n>, one storage bucket
# (WebStorage\<n>) per webview origin, and reads them from disk again when they are missing
# (observed on reference machine: 10.5 GiB in two buckets, only vscode-resource-cache-4..6).
# IndexedDB and the bucket database (QuotaManager) are never targets. A webview could also keep
# its own caches there, so this waits for approval.
[[rule]]
id       = "webview-resource-cache"
category = "ides"
tier     = "ask"
scope    = "user"
strategy = "delete"
targets  = ['%APPDATA%\Code\WebStorage\*\CacheStorage']
require  = { min_age_days = 2, not_in_use = true }
