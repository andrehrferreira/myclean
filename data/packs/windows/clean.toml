# Windows temp folders, crash data and system areas (cleaning spec; analysis F-011, F-016;
# sources: pack.toml). Targets are absolute patterns: %VARIABLES% are expanded, '*' and '?'
# match within one path component, and every entry the last component matches is one item.
# System areas go through their Windows cleanup handler or DISM, never through MyClean's own
# delete path. `handler` is the handler's key name under
# HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches; handlers that look at
# the owner's profile are scope "user" (run in the tray), the others "system" (run in the
# service); see docs/spikes/X3-cleanup-handlers.md. The DownloadsFolder (the owner's Downloads)
# and "User file versions" (File History) handlers are never offered. The setup and upgrade log
# handlers are in the windows-setup-logs pack.

[[rule]]
id       = "temp-user"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%TEMP%\*']
require  = { min_age_days = 2, not_in_use = true }

[[rule]]
id       = "temp-system"
category = "windows"
tier     = "auto"
scope    = "system"
strategy = "delete"
targets  = ['%WINDIR%\Temp\*']
require  = { min_age_days = 2, not_in_use = true }

# Application crash dumps (Windows Error Reporting LocalDumps).
[[rule]]
id       = "crash-dumps"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\CrashDumps\*']
require  = { min_age_days = 7, not_in_use = true }

[[rule]]
id       = "wer-user"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Microsoft\Windows\WER\ReportArchive\*',
            '%LOCALAPPDATA%\Microsoft\Windows\WER\ReportQueue\*']
require  = { min_age_days = 7, not_in_use = true }

# The deny-list protects %WINDIR% except Temp, so the engine drops these items with
# "deny_list:windir" until the deny-list allows this folder; no Windows handler covers it.
[[rule]]
id       = "live-kernel-reports"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "delete"
targets  = ['%WINDIR%\LiveKernelReports\*']
require  = { min_age_days = 7, not_in_use = true }

# PowerToys downloads each update's installer into Updates and never removes it (observed on
# reference machine: six powertoyssetup-<version>-x64.exe, 0.99.0 to 0.102.3001). An installer
# two weeks old is installed or superseded; PowerToys downloads the next one itself.
[[rule]]
id       = "powertoys-updates"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Microsoft\PowerToys\Updates\*.exe']
require  = { min_age_days = 14, not_in_use = true }

# Explorer keeps these open while it runs, so they are selected only when it does not.
[[rule]]
id       = "icon-cache"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Microsoft\Windows\Explorer\iconcache_*.db']
require  = { not_in_use = true }

[[rule]]
id       = "thumbnail-cache"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "handler"
handler  = "Thumbnail Cache"

# Legacy Internet Explorer / WebView INetCache of the owner.
[[rule]]
id       = "internet-cache"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "handler"
handler  = "Internet Cache Files"

[[rule]]
id       = "wer-system"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "Windows Error Reporting Files"

[[rule]]
id       = "memory-dumps"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "System error memory dump files"

[[rule]]
id       = "minidumps"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "System error minidump files"

[[rule]]
id       = "update-cleanup"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "Update Cleanup"

[[rule]]
id       = "delivery-optimization"
category = "windows"
tier     = "auto"
scope    = "system"
strategy = "handler"
handler  = "Delivery Optimization Files"

[[rule]]
id       = "temporary-setup-files"
category = "windows"
tier     = "auto"
scope    = "system"
strategy = "handler"
handler  = "Temporary Setup Files"

[[rule]]
id       = "upgrade-discarded-files"
category = "windows"
tier     = "auto"
scope    = "system"
strategy = "handler"
handler  = "Upgrade Discarded Files"

[[rule]]
id       = "reset-logs"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "Windows Reset Log Files"

[[rule]]
id       = "esd-files"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "Windows ESD installation files"

# Older versions of installed drivers.
[[rule]]
id       = "driver-packages"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "Device Driver Packages"

# Language resources no installed language uses.
[[rule]]
id       = "language-packs"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "Language Pack"

# Windows.old: removing it ends the option to roll back to the previous Windows version.
[[rule]]
id       = "previous-installations"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "handler"
handler  = "Previous Installations"

# The owner's own deleted files.
[[rule]]
id       = "recycle-bin"
category = "windows"
tier     = "ask"
scope    = "user"
strategy = "handler"
handler  = "Recycle Bin"

# What the owner deleted more than 30 days ago, from the bin of every fixed volume. With the
# Recycle Bin handler, min_age_days counts from each item's deletion time (its $I record), never
# from file times, and MyClean deletes the items itself through the shell, not through the
# handler (core/cleanup/recycle_bin.hpp). Analysis E 04: 49.1 GiB in E:'s bin.
[[rule]]
id       = "recycle-bin-aged"
category = "windows"
tier     = "auto"
scope    = "user"
strategy = "handler"
handler  = "Recycle Bin"
require  = { min_age_days = 30 }

# Superseded components of the component store (WinSxS), removed by DISM (source: pack.toml).
[[rule]]
id       = "component-store"
category = "windows"
tier     = "ask"
scope    = "system"
strategy = "native"
command  = "DISM /Online /Cleanup-Image /StartComponentCleanup"
