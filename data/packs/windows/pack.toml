id          = "windows"
version     = "1.3.0"
title       = "Windows"
description = "Windows' own temporary files, crash data and servicing areas (cleaned through Windows' cleanup handlers and DISM where Windows owns them), PowerToys' leftover update installers (cleaned), the system files and folders of a volume, MyClean's quarantine, the owner's folders, and what the Windows processes are."
sources     = [
  "https://learn.microsoft.com/windows/win32/lwef/disk-cleanup (cleanup handlers registered under HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\VolumeCaches)",
  "https://learn.microsoft.com/windows-hardware/manufacture/desktop/clean-up-the-winsxs-folder (DISM /Online /Cleanup-Image /StartComponentCleanup removes superseded components)",
  "https://learn.microsoft.com/windows/win32/wer/collecting-user-mode-dumps (application crash dumps in %LOCALAPPDATA%\\CrashDumps)",
  "observed on reference machine: temp folders, crash dumps, Windows error reports and kernel reports, the cleanup handlers and their scopes (docs/spikes/X3-cleanup-handlers.md), the volume's system files and folders, the owner's folders (analysis F-011, F-016)",
  "observed on reference machine: the running Windows processes, their image paths and signers",
  "observed on reference machine: PowerToys keeps the installer of every update it downloads (six powertoyssetup-<version>-x64.exe, 0.99.0 to 0.102.3001, 1.8 GiB) in its Updates folder",
  "observed on reference machine: a cumulative update (RollupFix 26100.9711) downloaded on 2026-10-13 waits in SoftwareDistribution, 6.3 GiB, the PC not restarted since 2026-09-30",
  "https://learn.microsoft.com/windows/win32/msi/rollback-installation (the installer keeps rollback scripts and backed-up files until the installation commits)",
  "observed on reference machine: G:\\Config.Msi (hidden, access denied to the owner)",
  "observed on reference machine: E:\\$RECYCLE.BIN held 49.1 GiB; each deleted item's $I record holds its size and deletion time, read without Explorer (docs/analysis/e-drive-reclaim/04-recycle-bin.md)",
]
min_myclean = "0.1.0"
