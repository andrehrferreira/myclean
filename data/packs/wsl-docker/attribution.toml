# Sources: learn.microsoft.com/windows/wsl, docs.docker.com and the reference machine
# (pack.toml).

[[area]]
id       = "distro-disks"
paths    = ['%LOCALAPPDATA%\Packages\*\LocalState\ext4.vhdx', '%LOCALAPPDATA%\wsl\*\ext4.vhdx']
category = "vm-disks"
label    = "WSL Linux distribution disks"
reclaim  = { kind = "relocate", ref = "distro", note = "`wsl --manage <distro> --move <folder>` moves one to another drive. The disk never shrinks by itself: `wsl --manage <distro> --set-sparse true` lets it give freed space back." }

[[area]]
id       = "docker-data"
paths    = ['%LOCALAPPDATA%\Docker\wsl', '%ProgramData%\DockerDesktop\vm-data']
category = "vm-disks"
label    = "Docker Desktop disk (images, containers, volumes)"
reclaim  = { kind = "relocate", ref = "docker", note = "Docker Desktop > Settings > Resources > Advanced > Disk image location moves it; `docker system prune` frees space inside it." }

# A WSL 1 distribution keeps its Linux files in a rootfs folder instead of a disk (observed on
# reference machine).
[[area]]
id       = "distro-files"
paths    = ['%LOCALAPPDATA%\Packages\*\LocalState\rootfs', '%LOCALAPPDATA%\Packages\*\rootfs']
category = "vm-disks"
label    = "WSL 1 Linux distribution file systems"
reclaim  = { kind = "relocate", ref = "distro-files", note = "WSL 1: `wsl --export`, then `wsl --import` on another drive." }

# WSL 1 never empties /tmp (no systemd-tmpfiles at start); test runs that leave their temporary
# folders behind pile up there (observed on reference machine: 39,000 `.tmpXXXXXX` folders of
# a test suite, 94 GiB, almost all a year old). Linux files must be changed from Linux only,
# never through this folder (learn.microsoft.com/windows/wsl/filesystems), so the clean rule
# runs `find` inside each distribution.
[[area]]
id       = "distro-tmp"
paths    = ['%LOCALAPPDATA%\Packages\*\LocalState\rootfs\tmp', '%LOCALAPPDATA%\Packages\*\rootfs\tmp']
category = "app-caches"
label    = "Temporary files inside a WSL 1 distribution (/tmp)"
reclaim  = { kind = "clean-rule", ref = "tmp-prune", note = "WSL 1 never empties /tmp. MyClean deletes the entries older than 7 days from inside Linux (`wsl -d <distro> -u root --exec find /tmp -mindepth 1 -maxdepth 1 -mtime +7 ! -name .*-unix -exec rm -rf {} +`), never from Windows." }
