# Docker's own prune (cleaning spec, "Native Prune Commands Under the User Token"; analysis
# F-013; source: docs.docker.com, see pack.toml), run by the tray under the owner's token.
# The tray runs it with --force: without a terminal the confirmation prompt would abort it. Docker keeps its
# data inside a virtual disk whose location varies, so there is no folder to measure: the rule
# is always offered and the command reports what it frees.

[[rule]]
id       = "docker-prune"
category = "containers"
tier     = "ask"
scope    = "user"
strategy = "native"
command  = "docker system prune"

# WSL never empties /tmp in a WSL 1 distribution (no systemd-tmpfiles at start), so test runs
# that leave their temporary folders behind pile up there (observed on reference machine:
# 39,000 `.tmpXXXXXX` test folders, 94 GiB in Ubuntu-24.04's /tmp). Linux files are changed
# from Linux only, never through the distribution's folder from Windows
# (https://learn.microsoft.com/windows/wsl/filesystems): the tray runs `find` as root inside
# each distribution (Docker Desktop's left out) and deletes the entries of /tmp older than 7
# days, keeping the X11/ICE/font socket folders. The targets are only measured, to offer the rule
# where a WSL 1 /tmp holds something; a WSL 2 /tmp lies inside ext4.vhdx and is not measured.
[[rule]]
id       = "tmp-prune"
category = "wsl"
tier     = "auto"
scope    = "user"
strategy = "native"
command  = "wsl tmp prune"
targets  = ['%LOCALAPPDATA%\Packages\*\LocalState\rootfs\tmp', '%LOCALAPPDATA%\Packages\*\rootfs\tmp']

# A Docker Desktop data folder Docker no longer uses (analysis F-drive 02 and 07; sources:
# docs.docker.com and the reference machine, see pack.toml). Docker Desktop keeps the disk of
# every image, container and volume in disk\docker_data.vhdx of the folder its settings name
# (Settings > Resources > Advanced > Disk image location: CustomWslDistroDir in
# %APPDATA%\Docker\settings-store.json, or the legacy settings.json). Moving that disk by
# copying, or renaming its folder, leaves a full copy Docker never reads again (observed on
# reference machine: F:\WSL\wsl\DockerDesktopWSL.ANTIGO, 998 GiB, last written 7 weeks before,
# while Docker runs from D:\Database\DockerDesktopWSL). A DockerDesktopWSL folder at the root or
# up to two levels below on a fixed volume is offered only when it holds disk\docker_data.vhdx,
# no Docker setting names it (%DOCKER_WSL_DATA%, every folder they name: when they cannot be
# read nothing is offered), nothing in it changed for 30 days and no process holds a file in it
# open (Docker's VM keeps the disk it runs on open). It may hold the only copy of a volume, so
# the owner decides.
[[rule]]
id       = "docker-data-copy"
category = "containers"
tier     = "ask"
scope    = "user"
strategy = "delete"
targets  = ['?:\DockerDesktopWSL*', '?:\*\DockerDesktopWSL*', '?:\*\*\DockerDesktopWSL*']
require  = { min_age_days = 30, not_in_use = true, contains = 'disk\docker_data.vhdx', outside_of = '%DOCKER_WSL_DATA%' }
