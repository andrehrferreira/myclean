id          = "wsl-docker"
version     = "1.0.0"
title       = "WSL and Docker Desktop disks"
description = "The virtual disks of WSL distributions and of Docker Desktop: where they are, and moving a distribution to another drive with WSL's own command."
sources     = [
  "https://learn.microsoft.com/windows/wsl/disk-space (the ext4.vhdx of a distribution is in the BasePath of its HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Lxss\\{GUID} key, named by DistributionName)",
  "https://learn.microsoft.com/windows/wsl/basic-commands (wsl --manage <distro> --move <location>, wsl --manage <distro> --set-sparse true, wsl --terminate)",
  "https://docs.docker.com/desktop/settings-and-maintenance/settings/ (Resources > Advanced > Disk image location)",
  "observed on reference machine: Ubuntu-24.04 in %LOCALAPPDATA%\\Packages\\CanonicalGroupLimited.Ubuntu24.04LTS_79rhkp1fndgsc\\LocalState\\ext4.vhdx; the docker-desktop distribution registered by Docker Desktop; %LOCALAPPDATA%\\Docker\\wsl",
]
min_myclean = "0.1.0"

[applies_when]
any = [{ path_exists = '%LOCALAPPDATA%\Packages\*\LocalState\ext4.vhdx' }, { path_exists = '%LOCALAPPDATA%\wsl' },
       { path_exists = '%LOCALAPPDATA%\Docker\wsl' }, { app_installed = '^Docker Desktop' }]
