targets  = [".dart_tool", "build"]
require  = { git_ignored = true, not_in_use = true, inactive_days = 30 }

# Unreal: rebuilding Binaries and DerivedDataCache takes long, so it is "ask". Saved holds the
# project's config, so only its Logs and Crashes are targets, never Saved itself.
[[rule]]
id       = "dev.unreal"
category = "dev-artifacts"
tier     = "ask"
scope    = "user"
strategy = "delete"
project  = { marker = "*.uproject" }
targets  = ["Intermediate", "DerivedDataCache", "Binaries", 'Saved\Logs', 'Saved\Crashes']
require  = { git_ignored = true, not_in_use = true, inactive_days = 14 }

# Unity: a project has Assets/ and ProjectSettings/ProjectVersion.txt. Reimporting Library takes
# long, so it is "ask".
[[rule]]
id       = "dev.unity"
category = "dev-artifacts"
tier     = "ask"
scope    = "user"
strategy = "delete"
project  = { marker = 'ProjectSettings\ProjectVersion.txt' }
targets  = ["Library", "Temp", "Obj", "Logs"]
require  = { git_ignored = true, not_in_use = true, inactive_days = 14 }
