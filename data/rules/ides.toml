# IDE caches (analysis F-013, F-016). Settings, keymaps, plugins and local history are never
# targets.

# One folder per VS Code version; old ones are left behind after updates.
[[rule]]
id       = "ide.vscode.cached_data"
category = "ides"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%APPDATA%\Code\CachedData\*']
require  = { min_age_days = 30, not_in_use = true }

# Per-workspace state (open editors, extension state) of workspaces not opened for 90 days.
[[rule]]
id       = "ide.vscode.workspace_storage"
category = "ides"
tier     = "ask"
scope    = "user"
strategy = "delete"
targets  = ['%APPDATA%\Code\User\workspaceStorage\*']
require  = { min_age_days = 90, not_in_use = true }

# Indexes; rebuilt on the next start, which takes a while on large projects.
[[rule]]
id       = "ide.jetbrains.caches"
category = "ides"
tier     = "ask"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\JetBrains\*\caches']
require  = { not_in_use = true }

# Local folders of IDE versions not run for 180 days, such as IntelliJIdea2023.1. Settings live
# in %APPDATA%\JetBrains and are not touched; Toolbox does not match the version pattern.
[[rule]]
id       = "ide.jetbrains.old_versions"
category = "ides"
tier     = "ask"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\JetBrains\*20??.*']
require  = { min_age_days = 180, not_in_use = true }

[[rule]]
id       = "ide.visualstudio.component_model_cache"
category = "ides"
tier     = "auto"
scope    = "user"
strategy = "delete"
targets  = ['%LOCALAPPDATA%\Microsoft\VisualStudio\*\ComponentModelCache']
require  = { not_in_use = true }
