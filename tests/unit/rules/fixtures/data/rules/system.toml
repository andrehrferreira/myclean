# Test fixture: system rules in the shipped format.

[[rule]]
id       = "windows.temp.system"
category = "windows"
tier     = "auto"
scope    = "system"
strategy = "handler"
handler  = "Temporary Files"
require  = { min_age_days = 2 }

[[rule]]
id       = "gpu.nvidia.dxcache"
category = "shader-caches"
tier     = "ask"
scope    = "user"
strategy = "quarantine"
targets  = ['%LOCALAPPDATA%\NVIDIA\DXCache']
